apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: osac-ext, namespace: osac, labels: { osac.io/gw-poc: "true" } }
spec:
  parentRefs: [ { name: osac-gateway, namespace: openshift-ingress, sectionName: external }, { name: osac-gateway, namespace: openshift-ingress, sectionName: ext-svc } ]
  hostnames: [ fulfillment-api-osac.apps.test-infra-cluster-dev.redhat.com, fulfillment-api ]
  rules:
  - matches: [ { path: { type: Exact, value: /api/fulfillment/v1/console_sessions/connect } } ]
    backendRefs: [ { name: fulfillment-console-proxy, port: 8090 } ]
    timeouts: { request: 0s }
  - matches: [ { path: { type: Exact, value: /.well-known/jwks.json } } ]
    backendRefs: [ { name: fulfillment-rest-gateway, port: 8000 } ]
    timeouts: { request: 10s }
  - matches:
    - { path: { type: PathPrefix, value: /api/fulfillment } }
    - { path: { type: PathPrefix, value: /api/events } }
    backendRefs: [ { name: fulfillment-rest-gateway, port: 8000 } ]
    timeouts: { request: 300s, backendRequest: 300s }
  - matches: [ { path: { type: RegularExpression, value: "/osac\\.public\\..*/Watch" } } ]
    backendRefs: [ { name: fulfillment-grpc-server, port: 8000 } ]
    timeouts: { request: 0s }
  - matches: [ { path: { type: RegularExpression, value: "/osac\\.public\\..*ConsoleProxy/Connect" } } ]
    backendRefs: [ { name: fulfillment-console-proxy, port: 8000 } ]
    timeouts: { request: 0s }
  - matches: [ { path: { type: RegularExpression, value: "/(osac\\.public\\.|grpc\\.(reflection|health)\\.).*" } } ]
    backendRefs: [ { name: fulfillment-grpc-server, port: 8000 } ]
    timeouts: { request: 0s }
