---
# Query DHCP leases for a network attachment against IPAM host entries in
# the target subnet. Bare-metal hosts are matched by NIC MAC address (they
# are not registered as named fabric servers); named fabric servers (e.g.
# CaaS agents) fall back to matching by server name.
#
# Input: network_attachment dict with host_name, logical_interface_name,
#        subnet_ref (same interface as create_network_attachment). The
#        subnet-ref → MAC map is supplied by the operator as
#        osac_job_vars.network_attachment_macs.
# Output: accumulates one entry per attachment into the _dhcp_leases fact,
#         which the playbook publishes as the job's leases artifact.

- name: Extract network attachment configuration
  ansible.builtin.set_fact:
    _dq_host_name: "{{ network_attachment.host_name }}"
    _dq_subnet_ref: "{{ network_attachment.subnet_ref }}"
    _dq_interface: "{{ network_attachment.logical_interface_name | default('') }}"

- name: Look up Subnet CR by UUID label
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    label_selectors:
      - "osac.openshift.io/subnet-uuid={{ _dq_subnet_ref }}"
  register: _dq_subnet_lookup

- name: Fail if Subnet CR not found
  ansible.builtin.fail:
    msg: >-
      Subnet with UUID '{{ _dq_subnet_ref }}' not found.
  when: _dq_subnet_lookup.resources | length == 0

- name: Set subnet name
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ _dq_subnet_lookup.resources[0].metadata.name }}"

- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Display DHCP lease query parameters
  ansible.builtin.debug:
    msg:
      - "Querying DHCP lease for host '{{ _dq_host_name }}'"
      - "Subnet: {{ _dq_subnet_name }} (UUID: {{ _dq_subnet_ref }})"

# --- Find IPAM subnet ID ---

- name: Get IPAM subnets from Netris
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/subnets"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_ipam_subnets_resp
  no_log: true

- name: Find IPAM subnet by name
  ansible.builtin.set_fact:
    _dq_ipam_subnet: >-
      {{ (_dq_ipam_subnets_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_subnet_name)
         | list | first | default(none) }}

- name: Fail if IPAM subnet not found
  ansible.builtin.fail:
    msg: >-
      IPAM subnet '{{ _dq_subnet_name }}' not found in Netris controller.
  when: _dq_ipam_subnet is none

# --- Match IPAM host by server name ---

- name: Query IPAM hosts for subnet
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/hosts/{{ _dq_ipam_subnet.id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_hosts_resp
  no_log: true

# The operator supplies the NIC MAC per subnet-ref. Netris stores lease MACs
# lowercase (sourced from the DHCP request), so normalise for comparison.
- name: Determine expected MAC for this attachment
  ansible.builtin.set_fact:
    _dq_mac: >-
      {{ ((osac_job_vars.network_attachment_macs | default({}))[_dq_subnet_ref]
          | default('')) | lower }}

- name: Find IPAM host matching MAC address
  ansible.builtin.set_fact:
    _dq_matched_host: >-
      {{ (_dq_hosts_resp.json.data | default([]))
         | selectattr('mac', 'defined')
         | selectattr('mac', 'truthy')
         | selectattr('mac', 'contains', _dq_mac)
         | list | first | default(none) }}
  when: _dq_mac | length > 0

- name: Find IPAM host matching server name
  ansible.builtin.set_fact:
    _dq_matched_host: >-
      {{ (_dq_hosts_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_host_name)
         | list | first | default(none) }}
  when: _dq_mac | length == 0

- name: Set discovered IP address
  ansible.builtin.set_fact:
    discovered_ip_address: >-
      {{ (_dq_matched_host is not none and _dq_matched_host is mapping)
         | ternary(_dq_matched_host.address | default(''), '') }}

- name: Fail if no DHCP lease found yet
  ansible.builtin.fail:
    msg: >-
      No DHCP lease found for host '{{ _dq_host_name }}'
      (interface '{{ _dq_interface }}', mac '{{ _dq_mac }}')
      in subnet '{{ _dq_subnet_name }}'.
      The server may not have booted yet or DHCP has not assigned a lease.
  when: discovered_ip_address | length == 0

# Accumulate across the playbook's per-attachment loop; the playbook publishes
# the aggregated list once as the job's leases artifact. Keys match the
# operator's DHCPLease struct (subnet_ref, interface, ip_address, mac_address).
- name: Accumulate discovered lease for this attachment
  ansible.builtin.set_fact:
    _dhcp_leases: >-
      {{ (_dhcp_leases | default([])) + [{
           'subnet_ref': _dq_subnet_ref,
           'interface': _dq_interface,
           'ip_address': discovered_ip_address,
           'mac_address': _dq_mac,
         }] }}

- name: Display DHCP lease query result
  ansible.builtin.debug:
    msg: "DHCP lease found: host '{{ _dq_host_name }}' → IP '{{ discovered_ip_address }}' in subnet '{{ _dq_subnet_name }}'"
