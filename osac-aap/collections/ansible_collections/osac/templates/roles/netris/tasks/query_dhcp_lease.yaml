---
# Query DHCP leases for a network attachment by resolving the server
# port MAC from host_name + logical_interface_name, then matching it
# against DHCP lease entries in the Netris IPAM.
#
# Input: network_attachment dict with host_name, logical_interface_name,
#        subnet_ref (same interface as create_network_attachment).
# Output: discovered_ip_address fact set to the matched IP, or
#         discovered_ip_address="" if no lease found yet.

- name: Extract network attachment configuration
  ansible.builtin.set_fact:
    _dq_host_name: "{{ network_attachment.host_name }}"
    _dq_logical_interface: "{{ network_attachment.logical_interface_name }}"
    _dq_subnet_ref: "{{ network_attachment.subnet_ref }}"

- name: Look up Subnet CR by UUID label
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    label_selectors:
      - "osac.openshift.io/subnet-uuid={{ _dq_subnet_ref }}"
  register: _dq_subnet_lookup

- name: Fail if Subnet CR not found
  ansible.builtin.fail:
    msg: >-
      Subnet with UUID '{{ _dq_subnet_ref }}' not found.
  when: _dq_subnet_lookup.resources | length == 0

- name: Set subnet name
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ _dq_subnet_lookup.resources[0].metadata.name }}"

- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

# --- Resolve server port MAC ---

- name: Get Netris inventory servers
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/hw?type=server"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_server_list_resp
  no_log: true

- name: Find server by host_name
  ansible.builtin.set_fact:
    _dq_target_server: >-
      {{ (_dq_server_list_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_host_name)
         | list | first | default(none) }}
  when: _dq_server_list_resp.json is mapping

- name: Fail if server not found
  ansible.builtin.fail:
    msg: >-
      Server '{{ _dq_host_name }}' not found in Netris inventory.
  when: _dq_target_server is not defined or _dq_target_server is none

- name: Get server ports
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ports?switchID={{ _dq_target_server.id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_ports_resp
  no_log: true

- name: Extract ports list from response
  ansible.builtin.set_fact:
    _dq_server_ports: >-
      {{ (_dq_ports_resp.json.data.data | default(_dq_ports_resp.json.data))
         | default([]) }}

- name: Find port matching interface name
  ansible.builtin.set_fact:
    _dq_target_port: >-
      {{ _dq_server_ports
         | selectattr('port', 'equalto', _dq_logical_interface)
         | list | first | default(none) }}

- name: Fail if port not found
  ansible.builtin.fail:
    msg: >-
      Port '{{ _dq_logical_interface }}' not found on server '{{ _dq_host_name }}'.
      Available ports: {{ _dq_server_ports | map(attribute='port') | list }}.
  when: _dq_target_port is none

- name: Extract port MAC address
  ansible.builtin.set_fact:
    _dq_port_mac: "{{ _dq_target_port.macAddress | default(_dq_target_port.mac_address, true) | lower }}"

- name: Display DHCP lease query parameters
  ansible.builtin.debug:
    msg:
      - "Querying DHCP lease for host '{{ _dq_host_name }}' interface '{{ _dq_logical_interface }}'"
      - "Port MAC: {{ _dq_port_mac }}"
      - "Subnet: {{ _dq_subnet_name }} (UUID: {{ _dq_subnet_ref }})"

# --- Query DHCP leases ---

- name: Get IPAM subnets from Netris
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/subnets"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_ipam_subnets_resp
  no_log: true

- name: Find IPAM subnet by name
  ansible.builtin.set_fact:
    _dq_ipam_subnet: >-
      {{ (_dq_ipam_subnets_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_subnet_name)
         | list | first | default(none) }}

- name: Fail if IPAM subnet not found
  ansible.builtin.fail:
    msg: >-
      IPAM subnet '{{ _dq_subnet_name }}' not found in Netris controller.
  when: _dq_ipam_subnet is none

- name: Query IPAM hosts for subnet
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/hosts/{{ _dq_ipam_subnet.id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_hosts_resp
  no_log: true

- name: Initialize matched IP
  ansible.builtin.set_fact:
    _dq_matched_ip: ""

- name: Find host matching port MAC
  ansible.builtin.set_fact:
    _dq_matched_ip: "{{ item.address }}"
  loop: "{{ _dq_hosts_resp.json.data | default([]) }}"
  when:
    - _dq_matched_ip | length == 0
    - (item.mac | default([]))
      | map(attribute='address')
      | map('lower')
      | select('equalto', _dq_port_mac)
      | list | length > 0
  loop_control:
    label: "{{ item.address | default('unknown') }}"
  no_log: true

- name: Set discovered IP address
  ansible.builtin.set_fact:
    discovered_ip_address: "{{ _dq_matched_ip }}"

- name: Display DHCP lease query result
  ansible.builtin.debug:
    msg: >-
      {{ (_dq_matched_ip | length > 0)
         | ternary(
             "DHCP lease found: MAC '" + _dq_port_mac + "' → IP '" + discovered_ip_address + "' in subnet '" + _dq_subnet_name + "'",
             "No DHCP lease found yet for MAC '" + _dq_port_mac + "' in subnet '" + _dq_subnet_name + "'") }}
