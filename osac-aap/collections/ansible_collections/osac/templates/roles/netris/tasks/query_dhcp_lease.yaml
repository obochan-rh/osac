---
# Query DHCP leases for a network attachment by matching the server
# name against IPAM host entries in the target subnet.
#
# Input: network_attachment dict with host_name, logical_interface_name,
#        subnet_ref (same interface as create_network_attachment).
# Output: discovered_ip_address fact set to the matched IP, or
#         discovered_ip_address="" if no lease found yet.

- name: Extract network attachment configuration
  ansible.builtin.set_fact:
    _dq_host_name: "{{ network_attachment.host_name }}"
    _dq_subnet_ref: "{{ network_attachment.subnet_ref }}"

- name: Look up Subnet CR by UUID label
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: Subnet
    label_selectors:
      - "osac.openshift.io/subnet-uuid={{ _dq_subnet_ref }}"
  register: _dq_subnet_lookup

- name: Fail if Subnet CR not found
  ansible.builtin.fail:
    msg: >-
      Subnet with UUID '{{ _dq_subnet_ref }}' not found.
  when: _dq_subnet_lookup.resources | length == 0

- name: Set subnet name
  ansible.builtin.set_fact:
    _dq_subnet_name: "{{ _dq_subnet_lookup.resources[0].metadata.name }}"

- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Display DHCP lease query parameters
  ansible.builtin.debug:
    msg:
      - "Querying DHCP lease for host '{{ _dq_host_name }}'"
      - "Subnet: {{ _dq_subnet_name }} (UUID: {{ _dq_subnet_ref }})"

# --- Find IPAM subnet ID ---

- name: Get IPAM subnets from Netris
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/subnets"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_ipam_subnets_resp
  no_log: true

- name: Find IPAM subnet by name
  ansible.builtin.set_fact:
    _dq_ipam_subnet: >-
      {{ (_dq_ipam_subnets_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_subnet_name)
         | list | first | default(none) }}

- name: Fail if IPAM subnet not found
  ansible.builtin.fail:
    msg: >-
      IPAM subnet '{{ _dq_subnet_name }}' not found in Netris controller.
  when: _dq_ipam_subnet is none

# --- Match IPAM host by server name ---

- name: Query IPAM hosts for subnet
  ansible.builtin.uri:
    force: true
    url: "{{ netris_controller_url }}/api/v2/ipam/hosts/{{ _dq_ipam_subnet.id }}"
    method: GET
    headers:
      Cookie: "connect.sid={{ netris_session_cookie }}"
    return_content: true
    status_code: 200
    timeout: "{{ netris_timeout | default(30) }}"
    validate_certs: "{{ netris_validate_certs | default(true) }}"
  register: _dq_hosts_resp
  no_log: true

- name: Find IPAM host matching server name
  ansible.builtin.set_fact:
    _dq_matched_host: >-
      {{ (_dq_hosts_resp.json.data | default([]))
         | selectattr('name', 'equalto', _dq_host_name)
         | list | first | default(none) }}

- name: Set discovered IP address
  ansible.builtin.set_fact:
    discovered_ip_address: >-
      {{ (_dq_matched_host is not none and _dq_matched_host is mapping)
         | ternary(_dq_matched_host.address | default(''), '') }}

- name: Publish discovered IP as job artifact
  ansible.builtin.set_stats:
    data:
      leases:
        - subnet_ref: "{{ _dq_subnet_ref }}"
          ip_address: "{{ discovered_ip_address }}"
          host_name: "{{ _dq_host_name }}"

- name: Display DHCP lease query result
  ansible.builtin.debug:
    msg: >-
      {{ (discovered_ip_address | length > 0)
         | ternary(
             "DHCP lease found: host '" + _dq_host_name + "' → IP '" + discovered_ip_address + "' in subnet '" + _dq_subnet_name + "'",
             "No DHCP lease found yet for host '" + _dq_host_name + "' in subnet '" + _dq_subnet_name + "'") }}
